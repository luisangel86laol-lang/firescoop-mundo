# Firescoop · mundo
# Baja de Geofabrik los mapas de OpenStreetMap de los países de paises.txt, los parte en
# cuadrículas para el juego y los publica en GitHub Pages:  https://<usuario>.github.io/firescoop-mundo/v1/
# Se lanza solo al cambiar paises.txt, a mano (Actions → Mundo → Run workflow) y el día 1 de cada mes.
name: Mundo

on:
  workflow_dispatch:
  push:
    paths:
      - paises.txt
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pyosmium
        run: pip install osmium

      - name: Bajar los mapas de OpenStreetMap
        run: |
          mkdir -p pbf
          grep -v '^[[:space:]]*#' paises.txt | tr -d '\r' | while read -r p || [ -n "$p" ]; do
            [ -z "$p" ] && continue
            f="pbf/$(echo "$p" | tr '/' '_').osm.pbf"
            curl -L --fail --retry 3 -o "$f" "https://download.geofabrik.de/$p-latest.osm.pbf"
            ls -lh "$f"
          done

      - name: Hacer las cuadrículas
        run: python mundo/hacer_mundo.py pbf/*.osm.pbf --salida public/v1

      # Aeródromos del X-Plane Scenery Gateway (GPL, archivos aparte). Si el Gateway falla, se publica igual el resto.
      - name: Aeródromos del Gateway
        continue-on-error: true
        timeout-minutes: 60
        run: python mundo/hacer_aeropuertos.py public/v1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
